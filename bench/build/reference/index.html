<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guitar</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 48rem; padding: 0 1rem; }
    [data-testid="fretboard"] { background: #3b2a1a; padding: 0.75rem 1rem; border-radius: 6px; margin: 1rem 0; }
    .string { position: relative; height: 2rem; border-bottom: 2px solid #c9c2b8; }
    .string .label { position: absolute; left: -0.9rem; color: #c9c2b8; font-size: 0.8rem; }
    .dot { position: absolute; top: 0.25rem; left: calc(var(--fret, 0) * 4.4%); min-width: 1.4rem; text-align: center;
           background: #e8b64a; color: #222; border-radius: 50%; font-size: 0.85rem; line-height: 1.4rem; }
    [data-testid="chord-name"] { font-size: 2rem; min-height: 2.5rem; }
    ul { line-height: 1.6; }
  </style>
</head>
<body>
  <h1>Guitar</h1>
  <button type="button" data-testid="start-audio">Start audio</button>
  <div data-testid="chord-name"></div>
  <div data-testid="fretboard">
    <div class="string" data-testid="string-1"><span class="label">1</span><span class="dot" data-testid="dot-1" data-fret="0">0</span></div>
    <div class="string" data-testid="string-2"><span class="label">2</span><span class="dot" data-testid="dot-2" data-fret="0">0</span></div>
    <div class="string" data-testid="string-3"><span class="label">3</span><span class="dot" data-testid="dot-3" data-fret="0">0</span></div>
    <div class="string" data-testid="string-4"><span class="label">4</span><span class="dot" data-testid="dot-4" data-fret="0">0</span></div>
    <div class="string" data-testid="string-5"><span class="label">5</span><span class="dot" data-testid="dot-5" data-fret="0">0</span></div>
    <div class="string" data-testid="string-6"><span class="label">6</span><span class="dot" data-testid="dot-6" data-fret="0">0</span></div>
  </div>
  <ul>
    <li>Chords: Q C, W G, E D, R Em, A Am, S F, D A, F E. Z: no chord, open strings.</li>
    <li>Spacebar strums down, M strums up, the period key mutes.</li>
    <li>Single strings: H 6, J 5, K 4, L 3, semicolon 2, apostrophe 1.</li>
  </ul>
  <script type="module" src="src/app.js"></script>
</body>
</html>
